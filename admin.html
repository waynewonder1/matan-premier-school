<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Matan Admin Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #14181F;
      color: white;
      font-family: 'Inter', sans-serif;
      margin: 0;
    }

    .admin-container {
      max-width: 1100px;
      margin: auto;
      padding: 50px 24px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .admin-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin: 0;
    }

    .admin-login {
      max-width: 420px;
      margin: 80px auto;
      background: #1A203A;
      padding: 35px;
      border-radius: 12px;
    }

    .admin-login h2 {
      font-family: 'Playfair Display', serif;
      margin-top: 0;
    }

    .admin-login input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #444;
      box-sizing: border-box;
    }

    .admin-login button,
    .logout-btn {
      background: #B68A4E;
      border: none;
      padding: 13px 22px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 5px;
    }

    .dashboard {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 35px;
    }

    .stat-card {
      background: #1A203A;
      padding: 25px;
      border-left: 4px solid #B68A4E;
    }

    .stat-card span {
      display: block;
      font-size: 32px;
      font-weight: 700;
      margin-top: 8px;
    }

    .enquiry-card {
      background: #1A203A;
      padding: 25px;
      margin-bottom: 18px;
      border: 1px solid #2f3654;
    }

    .enquiry-card h3 {
      margin-top: 0;
      color: #D4B37D;
    }

    .enquiry-meta {
      color: #C8CDD8;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .admin-status {
      margin-top: 15px;
      color: #D4B37D;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .admin-header {
        align-items: flex-start;
        gap: 20px;
        flex-direction: column;
      }
    }
    .enquiry-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  margin-bottom: 20px;
}

.enquiry-toolbar h2 {
  margin-bottom: 5px;
}

.enquiry-toolbar p {
  color: #C8CDD8;
  margin: 0;
}

#enquirySearch {
  width: 320px;
  max-width: 100%;
  padding: 12px 14px;
  border: 1px solid #39405e;
  background: #111628;
  color: white;
  border-radius: 6px;
}

.filter-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.filter-btn {
  background: #1A203A;
  color: #C8CDD8;
  border: 1px solid #39405e;
  padding: 9px 16px;
  cursor: pointer;
  border-radius: 5px;
}

.filter-btn.active {
  background: #B68A4E;
  color: #111628;
  border-color: #B68A4E;
}

.enquiry-card {
  position: relative;
}

.enquiry-top {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 20px;
}

.status-badge {
  display: inline-block;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  border-radius: 999px;
}

.status-new {
  background: rgba(182,138,78,0.2);
  color: #D4B37D;
}

.status-read {
  background: rgba(200,205,216,0.15);
  color: #C8CDD8;
}

.status-contacted {
  background: rgba(69,160,110,0.18);
  color: #8fd1a9;
}

.enquiry-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.enquiry-actions button {
  border: 1px solid #39405e;
  background: transparent;
  color: white;
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 5px;
}

.enquiry-actions button:hover {
  background: #222943;
}

.enquiry-actions .contacted-btn {
  border-color: #B68A4E;
  color: #D4B37D;
}

.enquiry-actions .archive-btn {
  color: #C8CDD8;
}

.enquiry-actions .delete-btn {
  color: #ff9b9b;
  border-color: rgba(255,120,120,0.4);
}

.contact-links a {
  color: #D4B37D;
  text-decoration: none;
}

.contact-links a:hover {
  text-decoration: underline;
}

@media (max-width: 700px) {
  .enquiry-toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  #enquirySearch {
    width: 100%;
  }

  .enquiry-top {
    flex-direction: column;
  }
}
  </style>
</head>

<body>

  <section id="loginSection" class="admin-login">

    <h2>Matan Admin</h2>

    <p>Sign in to view school enquiries.</p>

    <form id="adminLoginForm">

      <input
        type="email"
        id="adminEmail"
        placeholder="Email"
        required
      >

      <input
        type="password"
        id="adminPassword"
        placeholder="Password"
        required
      >

      <button type="submit">
        Sign In
      </button>

      <p id="loginStatus" class="admin-status"></p>

    </form>

  </section>


  <main id="dashboard" class="dashboard">

    <div class="admin-container">

      <div class="admin-header">

        <div>
          <p>Matan Premier Schools</p>
          <h1>Admin Dashboard</h1>
        </div>

        <button id="logoutButton" class="logout-btn">
          Log Out
        </button>

      </div>


      <section class="stats">

        <div class="stat-card">
          Total Enquiries
          <span id="totalEnquiries">0</span>
        </div>

        <div class="stat-card">
          Latest Enquiries
          <span id="latestCount">0</span>
        </div>

      </section>


      <div class="enquiry-toolbar">

  <div>
    <h2>Enquiries</h2>
    <p>View and manage parent enquiries.</p>
  </div>

  <input
    type="search"
    id="enquirySearch"
    placeholder="Search enquiries..."
  >

</div>

<div class="filter-row">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="new">New</button>
  <button class="filter-btn" data-filter="read">Read</button>
  <button class="filter-btn" data-filter="contacted">Contacted</button>
</div>

<div id="enquiriesList">
  Loading enquiries...
</div>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>

</body>
</html>
