# Free Supabase projects pause after about a week without activity, which
# would stop the contact form, applications and auto-reply emails.
# This calls a small database function (see supabase/keep_alive.sql) every
# few days, so a real query runs and the project stays active.

name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 * * 1,3,5'   # Mon, Wed and Fri, 06:00 UTC (09:00 Nairobi)
  workflow_dispatch:           # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run a query on the Supabase database
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "https://rfppiqqfojbcqehsvwcr.supabase.co/rest/v1/rpc/keep_alive" \
            -H "apikey: sb_publishable_qfbst0yt9KjV-Iwt02T8AA_Dq3Ev5KV" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase responded with HTTP $status: $(cat response.txt)"
          if [ "$status" != "200" ]; then
            echo "The database did not answer normally - the project may be paused."
            echo "Open supabase.com/dashboard and click Restore if it says Paused."
            exit 1
          fi
